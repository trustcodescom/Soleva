<!DOCTYPE html>
<html lang="en">

    <head>

        <!-- ==========================================
            Basic Meta Tags
        =========================================== -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- ==========================================
            SEO Meta Tags
        =========================================== -->
        <title>SOLEVA | Step Into Your Style</title>

        <meta name="description"
            content="Discover quality footwear for every style at SOLEVA. Shop sneakers, casual shoes, formal footwear, sports shoes, and more.">

        <meta name="author" content="Patrick Trust Ikechukwu">

        <!-- ==========================================
            Theme Color
        =========================================== -->
        <meta name="theme-color" content="#111111">

        <!-- ==========================================
            Favicon
        =========================================== -->
        <link rel="icon" type="image/png" href="images/logo/favicon.png">

        <!-- ==========================================
            Google Fonts
        =========================================== -->
        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin>

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
            rel="stylesheet">

        <!-- ==========================================
            Font Awesome
        =========================================== -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <!-- ==========================================
            CSS Files
        =========================================== -->
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/animations.css">
        <link rel="stylesheet" href="css/responsive.css">

    </head>

    <body>
        <!-- Announcement Bar -->
        <div class="announcement-bar">
            <p>Complimentary delivery on orders over <span>&#8358;100,000</span></p>
        </div>

        <!-- Header -->
        <header class="header">
            <div class="header-container">
                <!-- Mobile Menu Button -->
                <button class="menu-btn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <!-- logo -->
                <div class="logo-container">
                    <a href="index.html" class="logo" aria-label="SoleEva home">
                        <img src="assests/New folder/logo/image.svg" alt="SoleEva">
                    </a>
                </div>
                <!-- navigation -->
                <div class="nav-container">
                    <nav class="nav" aria-label="Main navigation">
                        <ul id="nav-links">
                            <li><a href="index.html">Home</a></li>
                            <li><a href="shop.html">Shop</a></li>
                            <li><a href="shop.html">Category</a></li>
                            <li><a href="about.html">About</a></li>
                            <li><a href="contact.html">Contact</a></li>
                        </ul>
                    </nav>
                </div>
                <!-- Header Actions -->
               <div class="header-actions">
                    <!-- Search --> 
                    <div class="search-container"> 
                        <button class="search-toggle" aria-label="Open search" aria-expanded="false"> <i class="fa-solid fa-magnifying-glass"></i> </button>

                        <form class="search-form" role="search">
                            <input
                                type="search"
                                class="search-input"
                                placeholder="Search shoes..."
                                aria-label="Search shoes"
                            >
                            <button type="submit" aria-label="Submit search">
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>
                        
                    </div> 
                    <!-- Account Dropdown -->
                    <div class="account-container">

                        <button
                            class="account-toggle"
                            aria-label="Account options"
                            aria-expanded="false"
                            aria-controls="account-dropdown"
                        >
                            <i class="fa-regular fa-user"></i>
                        </button>

                        <div class="account-dropdown" id="account-dropdown">
                            <a href="login.html">Login</a>
                            <a href="signup.html">Sign Up</a>
                        </div>

                    </div>
                    <!-- Cart --> 
                    <div class="cart-container"> 
                        <a href="cart.html" class="cart-link" aria-label="Shopping Cart"> 
                            <i class="fa-solid fa-cart-shopping"></i> 
                        </a> 
                    </div> 
                </div>
            </div>
        </header>

        <!-- <script src="js/scripts.js"></script> -->
        <script src="js/navigation.js"></script>
    </body>
</html>
